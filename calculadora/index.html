<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Prática</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculadora">
        <input type="text" id="visor" aria-label="visor da calculadora" readonly>

        <div class="botoes">
            <button type="button" class="acao" onclick="limpar()">C</button>
            <button type="button" class="acao" onclick="apagar()">⌫</button>
            <button type="button" class="acao" onclick="adicionar('(')" >(</button>
            <button type="button" class="acao" onclick="adicionar(')')">)</button>

            <button type="button" onclick="adicionar('/')">/</button>
            <button type="button" onclick="adicionar('*')">*</button>
            <button type="button" onclick="adicionar('^')">x^y</button>
            <button type="button" onclick="adicionar('%')">%</button>

            <button type="button" onclick="adicionar('7')">7</button>
            <button type="button" onclick="adicionar('8')">8</button>
            <button type="button" onclick="adicionar('9')">9</button>
            <button type="button" onclick="adicionar('-')">-</button>

            <button type="button" onclick="adicionar('4')">4</button>
            <button type="button" onclick="adicionar('5')">5</button>
            <button type="button" onclick="adicionar('6')">6</button>
            <button type="button" onclick="adicionar('+')">+</button>

            <button type="button" onclick="adicionar('1')">1</button>
            <button type="button" onclick="adicionar('2')">2</button>
            <button type="button" onclick="adicionar('3')">3</button>
            <button type="button" class="igual" onclick="calcular()">=</button>

            <button type="button" class="zero" onclick="adicionar('0')">0</button>
            <button type="button" onclick="adicionar('.')">.</button>
            <button type="button" onclick="adicionar('Math.sqrt(')">√</button>
            <button type="button" onclick="adicionar('Math.abs(')">|x|</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
